name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK turi"
        required: true
        default: "arm64"
        type: choice
        options:
          - "split"
          - "universal"
          - "arm64"
          - "armv7"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Use existing Android SDK only
        shell: bash
        run: |
          if [ -n "${ANDROID_SDK_ROOT}" ]; then
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          elif [ -n "${ANDROID_HOME}" ]; then
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          else
            echo "ANDROID_SDK_ROOT/ANDROID_HOME topilmadi (SDK oldindan mavjud bo'lishi kerak)" >&2
            exit 1
          fi

      - name: Decode release keystore (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret provided; release APK will be unsigned."
          fi

      - name: Resolve build type
        id: cfg
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "${TYPE}" ]; then
            TYPE="arm64"
          fi

          case "${TYPE}" in
            split)
              echo "gradle_props=-PSPLIT_PER_ABI=true -PBUILD_UNIVERSAL=false -PTARGET_ABI=all" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
              ;;
            universal)
              echo "gradle_props=-PSPLIT_PER_ABI=false -PBUILD_UNIVERSAL=false -PTARGET_ABI=all" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=app/build/outputs/apk/release/*release*.apk" >> "$GITHUB_OUTPUT"
              ;;
            armv7)
              echo "gradle_props=-PSPLIT_PER_ABI=false -PBUILD_UNIVERSAL=false -PTARGET_ABI=armeabi-v7a" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=app/build/outputs/apk/release/*armeabi-v7a*.apk" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "gradle_props=-PSPLIT_PER_ABI=false -PBUILD_UNIVERSAL=false -PTARGET_ABI=arm64-v8a" >> "$GITHUB_OUTPUT"
              echo "artifact_glob=app/build/outputs/apk/release/*arm64-v8a*.apk" >> "$GITHUB_OUTPUT"
              TYPE="arm64"
              ;;
          esac

          echo "build_type=${TYPE}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew clean assembleRelease ${{ steps.cfg.outputs.gradle_props }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eemote-${{ steps.cfg.outputs.build_type }}-apk
          path: ${{ steps.cfg.outputs.artifact_glob }}
          if-no-files-found: error
